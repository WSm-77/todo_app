server.port=8080
spring.jackson.date-format=eu.tgpn.todoapi.config.RFC3339DateFormat
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

spring.datasource.url=jdbc:postgresql://localhost:6543/${DB_NAME:-todo}
spring.datasource.username=${DB_USERNAME:-admin}
spring.datasource.password=${DB_PASSWORD:-admin}
spring.jpa.hibernate.ddl-auto=update
springdoc.api-docs.version=OPENAPI_3_0
jakarta.persistence.jdbc.url=jdbc:postgresql://localhost:6543/${DB_NAME:-todo}
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
